name: Checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='Tested commit: %H (parents: %P)'
          test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - &reclaim-space
        name: Reclaim unused SDK space
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/share/swift
          df -h /
      - run: nix flake check --show-trace --no-write-lock-file -L

  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='Tested commit: %H (parents: %P)'
          test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - name: Discover hosts and platforms
        id: hosts
        run: |
          matrix=$(nix eval --no-write-lock-file --json .#nixosConfigurations --apply '
            configs: builtins.map (host:
              let system = configs.${host}.config.nixpkgs.hostPlatform.system;
              in {
                inherit host system;
                runner = {
                  x86_64-linux = "ubuntu-24.04";
                  aarch64-linux = "ubuntu-24.04-arm";
                }.${system};
              }
            ) (builtins.attrNames configs)
          ')
          jq -e 'length > 0' <<< "$matrix" >/dev/null
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  builds:
    name: Build ${{ matrix.host }} (${{ matrix.system }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git log -1 --format='Tested commit: %H (parents: %P)'
          test -z "$(git status --porcelain)"
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - *reclaim-space
      - name: Build NixOS toplevel
        env:
          HOST: ${{ matrix.host }}
        run: nix build --no-link --no-write-lock-file -L ".#nixosConfigurations.${HOST}.config.system.build.toplevel"
