name: Checks

on:
  workflow_call:
    inputs:
      min-free-bytes:
        type: string
        default: '0'
      min-free-inodes:
        type: string
        default: '0'

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'Rinyaresu/dots' && github.event_name == 'push' && github.ref == 'refs/heads/perf/herdr-cache-benchmark'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
        with:
          enable_kvm: true
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - name: Require KVM for VM checks
        run: test -r /dev/kvm && test -w /dev/kvm
      - name: Record runner resources
        run: |
          nproc
          free -h
          df -h / /nix
      - name: Prepare disk on the disposable runner
        shell: bash
        env:
          MIN_FREE_BYTES: ${{ inputs.min-free-bytes }}
          MIN_FREE_INODES: ${{ inputs.min-free-inodes }}
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          python3 -B .github/scripts/disk_budget.py snapshot before-cleanup || echo 'No pre-cleanup measurement'
          decision=$(python3 -B .github/scripts/disk_budget.py choose \
            --min-bytes="$MIN_FREE_BYTES" --min-inodes="$MIN_FREE_INODES") || decision=clean
          printf 'disk_budget decision=%s min_bytes=%s min_inodes=%s\n' \
            "$decision" "$MIN_FREE_BYTES" "$MIN_FREE_INODES"
          if [[ "$decision" != skip ]]; then
            sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          fi
          python3 -B .github/scripts/disk_budget.py snapshot after-cleanup
      - name: Identify the exact public Herdr output
        id: herdr
        shell: bash
        run: |
          source=$(python3 -B scripts/export-source.py)
          output=$(nix eval --impure --raw --expr \
            "(builtins.getFlake \"path:$source\").inputs.herdr.packages.x86_64-linux.herdr.drvPath")
          out_path=$(nix-store --query --outputs "$output")
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'commit=%s drvPath=%s outPath=%s\n' "$GITHUB_SHA" "$output" "$out_path"
          if nix-store --check-validity "$out_path"; then
            echo 'Herdr output already present before restore' >&2
            exit 1
          fi
          echo "output=$out_path" >> "$GITHUB_OUTPUT"
          echo "key=herdr-benchmark-v1-44187548544-1-${out_path##*/}" >> "$GITHUB_OUTPUT"
      - name: Restore only the Herdr runtime binary cache
        id: herdr-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/herdr-cache
          key: ${{ steps.herdr.outputs.key }}
      - name: Require an exact cache hit before running the suite
        env:
          EXACT_HIT: ${{ steps.herdr-cache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.herdr-cache.outputs.cache-matched-key }}
          EXPECTED_KEY: ${{ steps.herdr.outputs.key }}
        run: |
          printf 'exact_hit=%s matched_key=%s expected_key=%s\n' \
            "$EXACT_HIT" "$MATCHED_KEY" "$EXPECTED_KEY"
          test "$EXACT_HIT" = true && test "$MATCHED_KEY" = "$EXPECTED_KEY" || {
            echo 'Exact Herdr cache unavailable; refusing to run a cold suite' >&2
            exit 1
          }
      - name: Import and verify the exact Herdr output
        env:
          HERDR_OUTPUT: ${{ steps.herdr.outputs.output }}
        run: |
          /usr/bin/time -v nix copy --no-check-sigs \
            --from "file://$RUNNER_TEMP/herdr-cache" "$HERDR_OUTPUT"
          nix-store --check-validity "$HERDR_OUTPUT"
          printf 'Herdr import verified: %s\n' "$HERDR_OUTPUT"
      - name: Complete checks including real VMs
        run: python3 -B .github/scripts/disk_budget.py watch -- /usr/bin/time -v ./scripts/check
