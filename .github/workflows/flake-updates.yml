name: Flake updates

on:
  schedule:
    - cron: '41 8 * * 1'
  workflow_dispatch:
    inputs:
      advisory:
        description: 'Critical security advisory (CVE-YYYY-NNNN or GHSA-xxxx-xxxx-xxxx)'
        required: true
        type: string

permissions: {}

concurrency:
  group: flake-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - name: Propose lockfile updates
        env:
          GH_TOKEN: ${{ github.token }}
          ADVISORY: ${{ inputs.advisory }}
          EVENT: ${{ github.event_name }}
        run: bash .github/propose-flake.sh
