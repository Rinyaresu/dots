name: Flake updates

on:
  schedule:
    - cron: '23 8 * * *'
    - cron: '41 8 * * 1'
  workflow_dispatch:
    inputs:
      advisory:
        description: 'Critical security advisory (CVE-YYYY-NNNN or GHSA-xxxx-xxxx-xxxx)'
        required: true
        type: string

permissions: {}

concurrency:
  group: flake-updates
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lane: [general, pi, herdr]
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086
      - name: Probe and propose ${{ matrix.lane }}
        env:
          GH_TOKEN: ${{ github.token }}
          LANE: ${{ matrix.lane }}
          ADVISORY: ${{ inputs.advisory }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: bash .github/propose-flake.sh
