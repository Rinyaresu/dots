id = "local.nvim-file-links"
name = "Neovim file links"
version = "0.1.0"
min_herdr_version = "0.9.5"
platforms = ["linux"]

[[actions]]
id = "open"
title = "Open local file in Neovim"
command = ["python3", "open_file.py"]

[[panes]]
id = "editor"
title = "Neovim"
placement = "overlay"
command = ["sh", "-c", 'exec nvim --cmd "set nomodeline" -- "${HERDR_NVIM_FILE:?missing file}"']

[[link_handlers]]
id = "file"
title = "Open file link in Neovim"
pattern = "^file://(localhost)?/"
action = "open"
